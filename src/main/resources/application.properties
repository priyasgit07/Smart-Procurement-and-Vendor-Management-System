spring.application.name=procurement

# Import optional local properties (ignored by Git) for local secrets and overrides
spring.config.import=optional:file:./application-local.properties,optional:classpath:application-local.properties

server.port=${SERVER_PORT:8083}

# ===============================
# Database Configuration (MySQL)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/procurement_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Disable open-in-view to prevent lazy loading within view rendering (best practice)
spring.jpa.open-in-view=false

# ===============================
# JWT Security Configuration
# ===============================
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}

# ===============================
# Demo Data Seeding Configuration
# ===============================
app.seed-demo-users=${SEED_DEMO_USERS:false}
app.demo-admin-password=${DEMO_ADMIN_PASSWORD:}
app.demo-manager-password=${DEMO_MANAGER_PASSWORD:}
app.demo-employee-password=${DEMO_EMPLOYEE_PASSWORD:}

# ===============================
# Logging
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# Jackson
# ===============================
spring.jackson.serialization.indent-output=true

# ===============================
# Swagger / OpenAPI
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# File Upload
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
