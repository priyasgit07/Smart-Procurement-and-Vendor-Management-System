# Test Database Configuration (In-Memory H2 with MySQL compatibility)
spring.datasource.url=jdbc:h2:mem:procurement_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test JWT Secret (minimum 32 characters for HS256)
jwt.secret=
jwt.expiration=3600000

# Test Demo User Seeding
app.seed-demo-users=true
app.demo-admin-password=adminTestPassword123!
app.demo-manager-password=managerTestPassword123!
app.demo-employee-password=employeeTestPassword123!
